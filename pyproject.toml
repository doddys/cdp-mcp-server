[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cdp-mcp"
version = "0.1.0"
description = "MCP server for Cloudera/CDP cluster administration and troubleshooting. Fork of dvergari/cloudera-mcp-server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
    { name = "Davide Vergari" },
    { name = "Davide Isoardi" },
    { name = "Doddy Sebastianus" },
]

keywords = ["cloudera", "cdp", "mcp", "llm", "ai", "devops"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # Cap <2: the MCP Python SDK's 2.0 major release removed `mcp.server.fastmcp`
    # (FastMCP moved to the standalone `fastmcp` package), which server.py imports.
    # A lockless `uv pip install -e .` would otherwise resolve to 2.0 and break.
    # Use `uv sync` to install from uv.lock, which pins the 1.x version.
    "mcp>=1.0.0,<2",
    "httpx[socks]>=0.27.0",
    "tenacity>=8.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.0",
    # Iceberg/Impala registry backend (optional at runtime)
    "impyla>=0.21.0",
    "thrift>=0.16.0",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6.2",
]

# pip-compatible extras (used by CI: pip install -e ".[dev]" and uv: uv sync --extra dev)
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Kerberos/SPNEGO for the four downstream service clients on Kerberized
# clusters. Optional: only needed when a CM instance has kerberos=true.
# Requires MIT krb5 at build/runtime (macOS: brew install krb5, then build with
# PKG_CONFIG_PATH=/opt/homebrew/opt/krb5/lib/pkgconfig).
kerberos = [
    "httpx-gssapi>=0.6.0",
]

[project.scripts]
cdp-mcp = "cdp_mcp.server:run"
# Standalone, offline data collector (no LLM, no MCP transport) for CDP
# clusters an LLM client cannot reach directly -- see src/cdp_mcp/collector/
# and scripts/build_collector_bundle.sh for offline packaging.
cdp-collect = "cdp_mcp.collector.collect:main"

# src-layout package discovery for the PEP 517 build backend (poetry-core).
# The dev/lock tool is uv; the build backend is independent of it.
[tool.poetry]
packages = [{ include = "cdp_mcp", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
